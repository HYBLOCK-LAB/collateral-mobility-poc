# B2 topology (X -> REASSIGN -> Y -> Z): synchronizer S1 as in b1-xy.conf and a
# second synchronizer S2 with its own sequencer and mediator. P_X, P_Y and P_Z
# connect to both. S1 and the participants keep the B1 ports, so a B1 stack and
# a B2 stack cannot run at the same time on one host; only the S2 nodes get new
# ports. ids.json carries the topology name ("b2").
#
# Started by scripts/canton.sh (CANTON_TOPOLOGY=b2) with bootstrap-b2.canton.
# Every node keeps its state in its own database of the dedicated PostgreSQL
# cluster (scripts/db.sh, which adds the S2 databases for this topology). All
# APIs bind to 127.0.0.1. The Ledger API has no authorization; the platform
# adapters are the only clients and enforce institution permissions themselves.

_storage {
  type = postgres
  config {
    dataSourceClass = "org.postgresql.ds.PGSimpleDataSource"
    properties = {
      serverName = ${CANTON_PG_HOST}
      portNumber = ${CANTON_PG_PORT}
      user = ${CANTON_PG_USER}
      password = ${CANTON_PG_PASSWORD}
    }
  }
  parameters {
    # Pinned Canton version; schema migrations run on first start.
    migrate-and-start = yes
    fail-fast-on-startup = yes
  }
}

canton {
  sequencers.s1_sequencer {
    storage = ${_storage}
    storage.config.properties.databaseName = canton_s1_sequencer
    storage.parameters.max-connections = 8
    public-api { address = 127.0.0.1, port = 4401 }
    admin-api { address = 127.0.0.1, port = 4402 }
    sequencer {
      type = reference
      config {
        storage = ${_storage}
        storage.config.properties.databaseName = canton_s1_sequencer_driver
        storage.parameters.max-connections = 8
      }
    }
  }

  mediators.s1_mediator {
    storage = ${_storage}
    storage.config.properties.databaseName = canton_s1_mediator
    storage.parameters.max-connections = 4
    admin-api { address = 127.0.0.1, port = 4412 }
  }

  sequencers.s2_sequencer {
    storage = ${_storage}
    storage.config.properties.databaseName = canton_s2_sequencer
    storage.parameters.max-connections = 8
    public-api { address = 127.0.0.1, port = 4421 }
    admin-api { address = 127.0.0.1, port = 4422 }
    sequencer {
      type = reference
      config {
        storage = ${_storage}
        storage.config.properties.databaseName = canton_s2_sequencer_driver
        storage.parameters.max-connections = 8
      }
    }
  }

  mediators.s2_mediator {
    storage = ${_storage}
    storage.config.properties.databaseName = canton_s2_mediator
    storage.parameters.max-connections = 4
    admin-api { address = 127.0.0.1, port = 4432 }
  }

  participants {
    p_x {
      storage = ${_storage}
      storage.config.properties.databaseName = canton_px
      storage.parameters.max-connections = 16
      ledger-api { address = 127.0.0.1, port = 4511 }
      admin-api { address = 127.0.0.1, port = 4512 }
      http-ledger-api { address = 127.0.0.1, port = 4513 }
    }
    p_y {
      storage = ${_storage}
      storage.config.properties.databaseName = canton_py
      storage.parameters.max-connections = 16
      ledger-api { address = 127.0.0.1, port = 4521 }
      admin-api { address = 127.0.0.1, port = 4522 }
      http-ledger-api { address = 127.0.0.1, port = 4523 }
    }
    p_z {
      storage = ${_storage}
      storage.config.properties.databaseName = canton_pz
      storage.parameters.max-connections = 16
      ledger-api { address = 127.0.0.1, port = 4531 }
      admin-api { address = 127.0.0.1, port = 4532 }
      http-ledger-api { address = 127.0.0.1, port = 4533 }
    }
  }
}
