# B1 topology (X -> Y -> Z): synchronizer S1 with one sequencer and one
# mediator, participants P_X (platform X), P_Y (platform Y) and P_Z (platform
# Z, added with the Z step; README §5). S2 comes in B2. The file keeps its
# stage-2 name so the X→Y baseline records stay valid; ids.json carries the
# topology name ("b1-xyz").
#
# Started by scripts/canton.sh with bootstrap-b1-xy.canton. Every node keeps its
# state in its own database of the dedicated PostgreSQL cluster (scripts/db.sh).
# All APIs bind to 127.0.0.1. The Ledger API has no authorization; the platform
# adapters are the only clients and enforce institution permissions themselves.

_storage {
  type = postgres
  config {
    dataSourceClass = "org.postgresql.ds.PGSimpleDataSource"
    properties = {
      serverName = ${CANTON_PG_HOST}
      portNumber = ${CANTON_PG_PORT}
      user = ${CANTON_PG_USER}
      password = ${CANTON_PG_PASSWORD}
    }
  }
  parameters {
    # Pinned Canton version; schema migrations run on first start.
    migrate-and-start = yes
    fail-fast-on-startup = yes
  }
}

canton {
  sequencers.s1_sequencer {
    storage = ${_storage}
    storage.config.properties.databaseName = canton_s1_sequencer
    storage.parameters.max-connections = 8
    public-api { address = 127.0.0.1, port = 4401 }
    admin-api { address = 127.0.0.1, port = 4402 }
    sequencer {
      type = reference
      config {
        storage = ${_storage}
        storage.config.properties.databaseName = canton_s1_sequencer_driver
        storage.parameters.max-connections = 8
      }
    }
  }

  mediators.s1_mediator {
    storage = ${_storage}
    storage.config.properties.databaseName = canton_s1_mediator
    storage.parameters.max-connections = 4
    admin-api { address = 127.0.0.1, port = 4412 }
  }

  participants {
    p_x {
      storage = ${_storage}
      storage.config.properties.databaseName = canton_px
      storage.parameters.max-connections = 16
      ledger-api { address = 127.0.0.1, port = 4511 }
      admin-api { address = 127.0.0.1, port = 4512 }
      http-ledger-api { address = 127.0.0.1, port = 4513 }
    }
    p_y {
      storage = ${_storage}
      storage.config.properties.databaseName = canton_py
      storage.parameters.max-connections = 16
      ledger-api { address = 127.0.0.1, port = 4521 }
      admin-api { address = 127.0.0.1, port = 4522 }
      http-ledger-api { address = 127.0.0.1, port = 4523 }
    }
    p_z {
      storage = ${_storage}
      storage.config.properties.databaseName = canton_pz
      storage.parameters.max-connections = 16
      ledger-api { address = 127.0.0.1, port = 4531 }
      admin-api { address = 127.0.0.1, port = 4532 }
      http-ledger-api { address = 127.0.0.1, port = 4533 }
    }
  }
}
