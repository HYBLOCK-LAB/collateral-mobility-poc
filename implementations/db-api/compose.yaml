x-api: &api
  build: .
  volumes:
    - ../../shared/schemas:/app/schemas:ro
  healthcheck:
    test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/db', timeout=3).close()"]
    interval: 5s
    timeout: 4s
    retries: 12

x-workflow-env: &workflow-env
  POC_BANK_A_TOKEN: "${POC_BANK_A_TOKEN:?Set POC_BANK_A_TOKEN}"
  POC_BANK_B_TOKEN: "${POC_BANK_B_TOKEN:?Set POC_BANK_B_TOKEN}"
  POC_BANK_C_TOKEN: "${POC_BANK_C_TOKEN:?Set POC_BANK_C_TOKEN}"
  POC_OBSERVER_TOKEN: "${POC_OBSERVER_TOKEN:?Set POC_OBSERVER_TOKEN}"
  MODEL_A_INTERNAL_TOKEN: "${MODEL_A_INTERNAL_TOKEN:?Set MODEL_A_INTERNAL_TOKEN}"

x-db: &db
  image: postgres:17
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
    interval: 5s
    timeout: 3s
    retries: 12

services:
  api-x:
    <<: *api
    environment:
      <<: *workflow-env
      PLATFORM: X
      DB_HOST: db-x
      DB_NAME: model_a_x
      DB_USER: model_a_x
      DB_PASSWORD: "${POSTGRES_X_PASSWORD:?Set POSTGRES_X_PASSWORD}"
    ports:
      - "127.0.0.1:${MODEL_A_X_PORT:-8101}:8000"
    networks: [x, xy]
    depends_on:
      db-x:
        condition: service_healthy

  api-y:
    <<: *api
    environment:
      <<: *workflow-env
      PLATFORM: Y
      DB_HOST: db-y
      DB_NAME: model_a_y
      DB_USER: model_a_y
      DB_PASSWORD: "${POSTGRES_Y_PASSWORD:?Set POSTGRES_Y_PASSWORD}"
    ports:
      - "127.0.0.1:${MODEL_A_Y_PORT:-8102}:8000"
    networks: [y, xy]
    depends_on:
      db-y:
        condition: service_healthy

  db-x:
    <<: *db
    environment:
      POSTGRES_DB: model_a_x
      POSTGRES_USER: model_a_x
      POSTGRES_PASSWORD: "${POSTGRES_X_PASSWORD:?Set POSTGRES_X_PASSWORD}"
    networks: [x]
    volumes:
      - x-data:/var/lib/postgresql/data

  db-y:
    <<: *db
    environment:
      POSTGRES_DB: model_a_y
      POSTGRES_USER: model_a_y
      POSTGRES_PASSWORD: "${POSTGRES_Y_PASSWORD:?Set POSTGRES_Y_PASSWORD}"
    networks: [y]
    volumes:
      - y-data:/var/lib/postgresql/data

networks:
  x:
  y:
  xy:

volumes:
  x-data:
  y-data:
